# Build the Vite app and publish dist/ to GitHub Pages.
# Pages serves static files only, so the site must be the built bundle,
# never the raw source.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/tideline-app-design-bmsapq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Create/enable the Pages site on first deploy if it isn't already.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages is (or was) in "deploy from a branch" mode, so every push also
      # triggers a legacy build that publishes the raw source — which cannot
      # render. The last deployment wins, so wait until the legacy build for
      # this commit has finished (or two minutes) before deploying; that way
      # the built bundle is the one that sticks. This is a no-op once the
      # Pages source is switched to "GitHub Actions".
      - name: Wait out the legacy branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            latest=$(curl -sf               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds/latest" || true)
            commit=$(jq -r '.commit // empty' <<<"$latest")
            status=$(jq -r '.status // empty' <<<"$latest")
            echo "latest pages build: commit=${commit:-none} status=${status:-none}"
            if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" != "building" ]; then
              break
            fi
            sleep 5
          done
      - id: deployment
        uses: actions/deploy-pages@v4
