# Free-plan Supabase projects pause after 7 days without traffic, and a
# paused project takes the TMDB proxy down with it: the site then sits on
# "Loading…" or opens with no titles. One small read every 3 days keeps it
# awake. Scheduled workflows run only from the default branch.
name: Keep Supabase awake

on:
  schedule:
    - cron: '23 14 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # The publishable key already ships in the bundle (src/lib/supabase.js).
      # Anonymous reads of `profiles` return no rows under RLS, but the query
      # still reaches Postgres, which is what counts as activity.
      - name: Read through the REST API
        run: |
          curl -sSf --retry 3 --retry-delay 10 \
            -H "apikey: sb_publishable_9zZ7fwGEISNFXsAOMLRL9A_af-YlM04" \
            "https://heaficaxneggnsayrrzs.supabase.co/rest/v1/profiles?select=user_id&limit=1"
